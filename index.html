<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-rows: 1fr auto;
    background: #DCE2E5;
    color: #283540;
    font-family: 'Piazzolla', Georgia, 'Times New Roman', serif;
    padding: env(safe-area-inset-top, 0) 1.5rem env(safe-area-inset-bottom, 0);
    box-sizing: border-box;
  }
  main {
    display: grid;
    place-items: center;
    align-content: center;
    gap: 1rem;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-weight: 465;
    font-variation-settings: 'opsz' 30;
    font-size: clamp(2rem, 3vw, 2.75rem);
    letter-spacing: 0.015em;
    line-height: 1;
  }
  .i { position: relative; }
  .i.round::after {
    content: "";
    position: absolute;
    left: calc(50% - 0.0075em + var(--dx) - var(--d) / 2);
    top: var(--dy);
    width: var(--d);
    height: var(--d);
    border-radius: 50%;
    background: currentColor;
  }
  p {
    margin: 0 -0.16em 0 0;
    font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-weight: 450;
    font-size: 0.8125rem;
    line-height: 1;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #6D7882;
  }
  footer {
    padding: 0 0 1.5rem;
    text-align: center;
    font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    color: #7C8790;
  }
</style>

<body>
<main>
  <h1 aria-label="Affiner"><span aria-hidden="true">Aff<span class="i">i</span>ner</span></h1>
  <p>Signal from data</p>
</main>
<footer>© <span id="year">2026</span> Affiner</footer>
<script>
document.getElementById('year').textContent = new Date().getFullYear();
(async () => {
  try { await document.fonts.load('465 400px Piazzolla'); } catch (e) {}
  if (!document.fonts.check('465 400px Piazzolla')) return;
  const S = 600, fs = 400, base = 470, x0 = 100;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'); g.font = '465 ' + fs + 'px Piazzolla'; g.fillText('i', x0, base);
  const adv = g.measureText('i').width, px = g.getImageData(0, 0, S, S).data;
  const ink = (x, y) => px[(y * S + x) * 4 + 3] > 60;
  const row = y => { for (let x = 0; x < S; x++) if (ink(x, y)) return true; return false; };
  let top = 0; while (top < S && !row(top)) top++;
  let bot = top; while (bot < S && row(bot)) bot++;
  let mn = S, mx = 0;
  for (let y = top; y < bot; y++) for (let x = 0; x < S; x++) if (ink(x, y)) { if (x < mn) mn = x; if (x > mx) mx = x; }
  if (bot >= S || mx <= mn) return;
  const w = (mx - mn + 1) / fs, h = (bot - top) / fs, d = Math.sqrt(w * h) * 1.02;
  const cx = ((mn + mx + 1) / 2 - (x0 + adv / 2)) / fs, cy = ((top + bot) / 2 - base) / fs;
  const h1 = document.querySelector('h1'), i = h1.querySelector('.i');
  i.textContent = '\u0131';
  const em = parseFloat(getComputedStyle(h1).fontSize);
  const probe = document.createElement('span');
  probe.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline';
  i.appendChild(probe);
  const baseline = (probe.getBoundingClientRect().top - i.getBoundingClientRect().top) / em;
  probe.remove();
  i.style.setProperty('--d', d + 'em');
  i.style.setProperty('--dx', cx + 'em');
  i.style.setProperty('--dy', (baseline + cy - d / 2) + 'em');
  i.classList.add('round');
})();
</script>
</body>
