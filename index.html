<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Affiner</title>
<meta name="description" content="Signal from data">
<meta name="theme-color" content="#DCE2E5">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23DCE2E5'/%3E%3Cg fill='%23283540'%3E%3Ccircle cx='4' cy='4' r='0.95' opacity='0.36'/%3E%3Ccircle cx='4' cy='10' r='0.99' opacity='0.40'/%3E%3Ccircle cx='4' cy='16' r='0.95' opacity='0.36'/%3E%3Ccircle cx='4' cy='22' r='0.89' opacity='0.30'/%3E%3Ccircle cx='4' cy='28' r='0.86' opacity='0.27'/%3E%3Ccircle cx='10' cy='4' r='1.10' opacity='0.51'/%3E%3Ccircle cx='10' cy='10' r='1.18' opacity='0.60'/%3E%3Ccircle cx='10' cy='16' r='1.10' opacity='0.51'/%3E%3Ccircle cx='10' cy='22' r='0.95' opacity='0.36'/%3E%3Ccircle cx='10' cy='28' r='0.87' opacity='0.28'/%3E%3Ccircle cx='16' cy='4' r='1.18' opacity='0.60'/%3E%3Ccircle cx='16' cy='16' r='1.18' opacity='0.60'/%3E%3Ccircle cx='16' cy='22' r='0.99' opacity='0.40'/%3E%3Ccircle cx='16' cy='28' r='0.88' opacity='0.29'/%3E%3Ccircle cx='22' cy='4' r='1.10' opacity='0.51'/%3E%3Ccircle cx='22' cy='10' r='1.18' opacity='0.60'/%3E%3Ccircle cx='22' cy='16' r='1.10' opacity='0.51'/%3E%3Ccircle cx='22' cy='22' r='0.95' opacity='0.36'/%3E%3Ccircle cx='22' cy='28' r='0.87' opacity='0.28'/%3E%3Ccircle cx='28' cy='4' r='0.95' opacity='0.36'/%3E%3Ccircle cx='28' cy='10' r='0.99' opacity='0.40'/%3E%3Ccircle cx='28' cy='16' r='0.95' opacity='0.36'/%3E%3Ccircle cx='28' cy='22' r='0.89' opacity='0.30'/%3E%3Ccircle cx='28' cy='28' r='0.86' opacity='0.27'/%3E%3Ccircle cx='16' cy='10' r='2.6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Piazzolla:opsz,wght@8..30,100..900&family=Geist:wght@100..900&display=swap">
<style>
  :root { color-scheme: light; }
  *, *::before, *::after { cursor: default; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    display: grid;
    grid-template-rows: 1fr auto;
    background: #DCE2E5;
    color: #283540;
    font-family: 'Piazzolla', Georgia, 'Times New Roman', serif;
    padding: env(safe-area-inset-top, 0) 1.5rem env(safe-area-inset-bottom, 0);
    box-sizing: border-box;
    touch-action: none;
  }
  #field { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  main, footer { position: relative; z-index: 1; }
  main {
    display: grid;
    place-items: center;
    align-content: center;
    gap: 1rem;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-weight: 465;
    font-variation-settings: 'opsz' 30;
    font-size: clamp(2rem, 3vw, 2.75rem);
    letter-spacing: 0.015em;
    line-height: 1;
  }
  p {
    margin: 0 -0.16em 0 0;
    font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-weight: 450;
    font-size: 0.8125rem;
    line-height: 1;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #6D7882;
  }
  footer {
    padding: 0 0 1.5rem;
    text-align: center;
    font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    color: #7C8790;
  }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<main>
  <h1 aria-label="Affiner"><span aria-hidden="true">Aff<span class="i">i</span>ner</span></h1>
  <p>Signal from data</p>
</main>
<footer>© <span id="year">2026</span> Affiner</footer>
<script>
document.getElementById('year').textContent = new Date().getFullYear();
(async () => {
  const INK = '#283540', TAU = Math.PI * 2;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('field'), ctx = cv.getContext('2d');
  const main = document.querySelector('main'), foot = document.querySelector('footer');
  const h1 = document.querySelector('h1'), iSpan = h1.querySelector('.i');
  const mctx = document.createElement('canvas').getContext('2d');

  try {
    await document.fonts.load('465 400px Piazzolla');
    await document.fonts.load('450 13px Geist');
    await document.fonts.ready;
  } catch (e) {}

  let M = null;
  if (document.fonts.check('465 400px Piazzolla')) {
    const S = 600, fs = 400, base = 470, x0 = 100;
    const c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d'); g.font = '465 ' + fs + 'px Piazzolla'; g.fillText('i', x0, base);
    const adv = g.measureText('i').width, px = g.getImageData(0, 0, S, S).data;
    const ink = (x, y) => px[(y * S + x) * 4 + 3] > 60;
    const row = y => { for (let x = 0; x < S; x++) if (ink(x, y)) return true; return false; };
    let top = 0; while (top < S && !row(top)) top++;
    let bot = top; while (bot < S && row(bot)) bot++;
    let mn = S, mx = 0;
    for (let y = top; y < bot; y++) for (let x = 0; x < S; x++) if (ink(x, y)) { if (x < mn) mn = x; if (x > mx) mx = x; }
    if (bot < S && mx > mn) {
      const w = (mx - mn + 1) / fs, h = (bot - top) / fs;
      M = { d: Math.sqrt(w * h) * 1.02, cx: ((mn + mx + 1) / 2 - (x0 + adv / 2)) / fs, cy: ((top + bot) / 2 - base) / fs };
      iSpan.textContent = '\u0131';
    }
  }

  const ROAM_R = 3.2, MARGIN = 4, BEHIND_OPACITY = 0.15;
  let gAmt = 0, gTarget = 0;
  let W, H, sp, ox, oy, cols, rows, sigma, hi = -1, hj = -1, glyphs = [];
  let home = { x: 0, y: 0, r: 2.5 };
  const dot = { x: 0, y: 0, r: 2.5, a: 1 }, ctr = { x: 0, y: 0 };
  const FADE = 0.24;
  let ghosts = [];
  let target = { x: 0, y: 0, r: 2.5, home: true }, docked = true, earned = false;
  let ripple = null, raf = 0, last = 0;

  function baselineOf(el) {
    const p = document.createElement('span');
    p.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline';
    el.appendChild(p); const y = p.getBoundingClientRect().top; p.remove(); return y;
  }

  function naturalHome() {
    const em = parseFloat(getComputedStyle(h1).fontSize);
    if (!M) { const r = h1.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top - em * 0.6, r: 0 }; }
    const baseY = baselineOf(iSpan), ir = iSpan.getBoundingClientRect();
    return { x: ir.left + ir.width / 2 - 0.0075 * em + M.cx * em, y: baseY + M.cy * em, r: M.d * em / 2 };
  }

  // Ink boxes for each visible character, plus a small margin, so only the dots
  // directly behind the letters are softened.
  function glyphBoxes() {
    const out = [];
    for (const [el, mg] of [[h1, MARGIN], [main.querySelector('p'), 2], [foot, 1]]) {
      const cs = getComputedStyle(el);
      mctx.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
      const up = cs.textTransform === 'uppercase', base = baselineOf(el);
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), rg = document.createRange();
      let n;
      while ((n = walker.nextNode())) {
        const t = n.textContent;
        for (let k = 0; k < t.length; k++) {
          rg.setStart(n, k); rg.setEnd(n, k + 1);
          const r = rg.getBoundingClientRect(); if (!r.width) continue;
          const m = mctx.measureText(up ? t[k].toUpperCase() : t[k]);
          const a = m.actualBoundingBoxAscent, d = m.actualBoundingBoxDescent;
          if (a + d <= 0) continue;
          out.push({ l: r.left - mg, r: r.right + mg, t: base - a - mg, b: base + d + mg });
        }
      }
    }
    return out;
  }
  const behind = (x, y) => glyphs.some(g => x > g.l && x < g.r && y > g.t && y < g.b);

  function layout() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sp = W < 600 ? 26 : 32;
    sigma = sp * 2.45;

    // The grid is always symmetric about the window's centre. A symmetric grid can put
    // either a column or a gap at the centre, so there are lattice positions every half
    // spacing. The lockup moves to the nearest one.
    main.style.transform = 'none';
    const nat = naturalHome();
    const cx = W / 2, cy = H / 2, half = sp / 2;
    const gx = cx + Math.round((nat.x - cx) / half) * half;

    // Vertically, anywhere between "centred above the footer" (the natural spot) and
    // "centred in the window" reads as centred, so pick a lattice row inside that band.
    const band = Math.max(0, cy - foot.getBoundingClientRect().top / 2);
    const lo = nat.y, hiY = nat.y + band;
    const a = Math.ceil((lo - cy) / half), b = Math.floor((hiY - cy) / half);
    const n = a <= b ? Math.round((((lo + hiY) / 2) - cy) / half) : Math.round((nat.y - cy) / half);
    const gy = cy + Math.min(Math.max(n, a <= b ? a : n), a <= b ? b : n) * half;

    main.style.transform = 'translate(' + (gx - nat.x) + 'px, ' + (gy - nat.y) + 'px)';
    home = { x: gx, y: gy, r: nat.r };
    ox = gx - Math.floor(gx / sp) * sp; oy = gy - Math.floor(gy / sp) * sp;
    cols = Math.floor((W - ox) / sp) + 1; rows = Math.floor((H - oy) / sp) + 1;
    hi = M ? Math.round((gx - ox) / sp) : -1; hj = M ? Math.round((gy - oy) / sp) : -1;
    glyphs = glyphBoxes();

    target = { ...home, home: true }; docked = true; earned = false;
    dot.x = ctr.x = home.x; dot.y = ctr.y = home.y; dot.r = home.r; dot.a = 1; ghosts = [];
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = INK;
    const s2 = 2 * sigma * sigma;
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
      if (i === hi && j === hj) continue;
      if (!target.home && i === target.i && j === target.j) continue;
      if (ghosts.some(g => g.i === i && g.j === j)) continue;
      const x = ox + i * sp, y = oy + j * sp;
      const dx = x - ctr.x, dy = y - ctr.y;
      const k = gAmt * Math.exp(-(dx * dx + dy * dy) / s2);
      let r = 1.1 + 1.5 * k, o = 0.10 + 0.46 * k;
      if (ripple) {
        const d = Math.hypot(x - ripple.x, y - ripple.y);
        const band = Math.exp(-((d - ripple.rad) ** 2) / (2 * 20 * 20)) * ripple.amp;
        o += 0.26 * band;
      }
      if (behind(x, y)) o *= BEHIND_OPACITY;
      ctx.globalAlpha = Math.min(o, 1);
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    }
    if (M) {
      const dim = (d, isHome) => isHome || !behind(d.x, d.y) ? 1 : 0.4;
      for (const g of ghosts) {
        ctx.globalAlpha = g.a * dim(g, g.home);
        ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = dot.a * dim(dot, target.home);
      ctx.beginPath(); ctx.arc(dot.x, dot.y, dot.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function step(now) {
    raf = 0;
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016; last = now;
    const kc = reduce ? 1 : 1 - Math.exp(-dt * 5);
    ctr.x += (target.x - ctr.x) * kc; ctr.y += (target.y - ctr.y) * kc;
    gAmt += (gTarget - gAmt) * (reduce ? 1 : 1 - Math.exp(-dt * 4));
    const f = reduce ? 1 : dt / FADE;
    dot.a = Math.min(1, dot.a + f);
    for (const g of ghosts) g.a -= f;
    ghosts = ghosts.filter(g => g.a > 0);
    if (target.home && !docked && dot.a >= 1) {
      docked = true;
      if (earned && !reduce) ripple = { x: home.x, y: home.y, rad: 0, amp: 1 };
      earned = false;
    }
    if (ripple) {
      ripple.rad += dt * 260;
      ripple.amp = Math.max(0, 1 - ripple.rad / (sp * 10));
      if (ripple.amp <= 0.01) ripple = null;
    }
    draw();
    const busy = dot.a < 1 || ghosts.length || Math.hypot(target.x - ctr.x, target.y - ctr.y) > 0.3 || ripple || Math.abs(gTarget - gAmt) > 0.005;
    if (busy) request(); else last = 0;
  }
  function request() { if (!raf) raf = requestAnimationFrame(step); }

  function moveTo(t) {
    if (dot.a > 0.02) ghosts.push({ x: dot.x, y: dot.y, r: dot.r, a: dot.a, home: !!target.home,
      i: target.home ? hi : target.i, j: target.home ? hj : target.j });
    target = t; dot.x = t.x; dot.y = t.y; dot.r = t.r; dot.a = reduce ? 1 : 0; docked = false;
    request();
  }

  function goHome(isEarned) {
    if (!target.home) { earned = isEarned; moveTo({ ...home, home: true }); }
  }

  function onMove(x, y) {
    if (!M) return;
    if (gTarget !== 1) { gTarget = 1; request(); }
    const i = Math.max(0, Math.min(cols - 1, Math.round((x - ox) / sp)));
    const j = Math.max(0, Math.min(rows - 1, Math.round((y - oy) / sp)));
    if (i === hi && j === hj) { goHome(true); return; }
    if (target.home || target.i !== i || target.j !== j) {
      earned = false;
      moveTo({ x: ox + i * sp, y: oy + j * sp, r: ROAM_R, home: false, i, j });
    }
  }

  addEventListener('pointermove', e => onMove(e.clientX, e.clientY));
  addEventListener('pointerdown', e => onMove(e.clientX, e.clientY));
  const leave = () => { gTarget = 0; goHome(false); request(); };
  document.addEventListener('mouseout', e => { if (!e.relatedTarget) leave(); });
  addEventListener('blur', leave);
  addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') leave(); });
  addEventListener('resize', layout);

  layout();
})();
</script>
</body>
</html>
